name: Multibranch Strategy Setup

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - 'release/**'
      - main

jobs:
  ci-reusable:
    uses: naveenkondeti123/organization1/.github/workflows/deploy-azure.yml@main
    with:
      service_name: payment-service
      environment: development
      node-version: '20'

  feature-ci:
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display branch information
        run: |
          echo "Current branch: ${{ github.ref_name }}"
          echo "Feature CI pipeline running"