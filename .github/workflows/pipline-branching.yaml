name: mutibranching startageys setup code

on:
  push:
    branches:
      - 'feature/**'
      - devlop
      - 'release/**'
      - main

jobs:
  feature-ci:
    if: startsWith(github.ref, 'refs/heads/feature')
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: run test
        run: echo "running test successfully"

  devlopment-ci:
    if: github.ref == 'refs/heads/devlop'
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: run test
        run: echo "running test successfully"

  release-ci:
    if: startsWith(github.ref, 'refs/heads/release')
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: run test
        run: echo "running test successfully"

  production-ci:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: run test
        run: echo "running test successfully"
